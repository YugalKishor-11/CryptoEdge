<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <linearGradient id="coinBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#164d8f"/>
      <stop offset="1" stop-color="#06182f"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3c4b5e"/>
      <stop offset="0.45" stop-color="#172638"/>
      <stop offset="1" stop-color="#050b14"/>
    </linearGradient>
    <linearGradient id="solana" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset=".55" stop-color="#00c8cf"/>
      <stop offset="1" stop-color="#c03cff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Brand -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="55" y="45" width="64" height="64" rx="14" fill="#147cff"/>
    <path d="M70 87 L84 73 L94 82 L108 61" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M101 61h7v7" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <text x="135" y="92" font-size="39" font-weight="700" fill="#fff">CryptoEdge</text>
    <text x="58" y="140" font-size="17" letter-spacing="5" fill="#c8d7ee">Track · Analyse · Invest · Grow</text>

    <text x="55" y="220" font-size="47" font-weight="700" fill="#fff">A Smarter Way</text>
    <text x="55" y="273" font-size="47" font-weight="700" fill="#fff">to Invest in <tspan fill="#1683ff">Crypto</tspan></text>

    <text x="55" y="320" font-size="20" fill="#d6e3f5">
      <tspan x="55" dy="0">Real-time market data, powerful insights</tspan>
      <tspan x="55" dy="29">and tools to help you stay ahead</tspan>
      <tspan x="55" dy="29">in the crypto world.</tspan>
    </text>

    <!-- Benefits -->
    <g>
      <circle cx="83" cy="420" r="25" fill="#147cff"/>
      <path d="M70 431v-13h8v13m4 0v-22h8v22m4 0v-17h8v17" stroke="#fff" stroke-width="4" fill="none"/>
      <text x="122" y="414" font-size="18" font-weight="700" fill="#fff">Live Market Data</text>
      <text x="122" y="438" font-size="14" fill="#cbd9eb">Track prices in real-time</text>

      <circle cx="83" cy="490" r="25" fill="#147cff"/>
      <path d="M83 474l13 5v10c0 10-7 16-13 19-6-3-13-9-13-19v-10z" fill="none" stroke="#fff" stroke-width="3"/>
      <text x="122" y="484" font-size="18" font-weight="700" fill="#fff">Secure &amp; Reliable</text>
      <text x="122" y="508" font-size="14" fill="#cbd9eb">Your data stays protected</text>

      <circle cx="83" cy="560" r="25" fill="#147cff"/>
      <path d="M88 542l-12 20h9l-4 17 13-22h-9z" fill="#fff"/>
      <text x="122" y="554" font-size="18" font-weight="700" fill="#fff">Build Your Portfolio</text>
      <text x="122" y="578" font-size="14" fill="#cbd9eb">Smarter decisions, bigger opportunities</text>
    </g>

    <text x="55" y="645" font-size="17" fill="#d6e3f5">“The future of finance is decentralized.”</text>
    <text x="55" y="670" font-size="14" fill="#d6e3f5">— CryptoEdge</text>
  </g>

  <!-- Rising chart -->
  <g opacity=".9" filter="url(#glow)">
    <path d="M350 405 C410 365 420 390 455 345 C500 290 530 300 560 245 C610 165 665 150 825 55"
          fill="none" stroke="#008cff" stroke-width="6" stroke-linecap="round"/>
    <g fill="#087dff">
      <rect x="535" y="250" width="14" height="55" rx="2"/>
      <rect x="570" y="215" width="14" height="65" rx="2"/>
      <rect x="605" y="185" width="14" height="70" rx="2"/>
      <rect x="640" y="150" width="14" height="75" rx="2"/>
      <rect x="675" y="120" width="14" height="70" rx="2"/>
      <rect x="710" y="92" width="14" height="72" rx="2"/>
      <rect x="745" y="65" width="14" height="70" rx="2"/>
      <rect x="780" y="38" width="14" height="65" rx="2"/>
      <rect x="815" y="20" width="14" height="65" rx="2"/>
    </g>
  </g>

  <!-- Rocks -->
  <g stroke="#1e4d78" stroke-width="3">
    <path d="M420 410 L485 345 L600 365 L690 445 L760 565 L670 625 L455 585 L385 500Z" fill="url(#rock)"/>
    <path d="M315 505 L390 430 L500 455 L575 545 L530 640 L330 625 L275 565Z" fill="url(#rock)"/>
    <path d="M270 585 L350 545 L470 585 L530 700 L210 700Z" fill="url(#rock)"/>
    <path d="M560 560 L675 510 L790 565 L850 700 L500 700 L510 625Z" fill="url(#rock)"/>
  </g>

  <!-- Neon rock cracks -->
  <g stroke="#008cff" stroke-width="5" stroke-linecap="round" filter="url(#glow)">
    <path d="M355 570l28 18-15 28"/>
    <path d="M590 600l30 20-15 32"/>
    <path d="M710 570l28 20-13 28"/>
  </g>

  <!-- Ethereum coin -->
  <g transform="translate(660 245)">
    <circle r="76" fill="#008cff" opacity=".45" filter="url(#glow)"/>
    <circle r="69" fill="url(#coinBlue)" stroke="#5b83aa" stroke-width="4"/>
    <circle r="57" fill="none" stroke="#008cff" stroke-width="2"/>
    <path d="M0-43L-22 4 0-7 22 4Z" fill="#71dcff"/>
    <path d="M0-43V-7L22 4Z" fill="#a9ecff"/>
    <path d="M0 4l-22 7 22 28 22-28Z" fill="#3bbfff"/>
    <path d="M0 4v35l22-28Z" fill="#75dcff"/>
  </g>

  <!-- Bitcoin coin -->
  <g transform="translate(560 430)">
    <circle r="108" fill="#008cff" opacity=".45" filter="url(#glow)"/>
    <circle r="100" fill="#171717" stroke="#637284" stroke-width="5"/>
    <circle r="84" fill="none" stroke="#303a46" stroke-width="4"/>
    <text x="0" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="125" font-weight="700" fill="#ffb800">₿</text>
  </g>

  <!-- Solana-style coin -->
  <g transform="translate(365 575)">
    <circle r="67" fill="#008cff" opacity=".45" filter="url(#glow)"/>
    <circle r="62" fill="url(#coinBlue)" stroke="#5b83aa" stroke-width="4"/>
    <g fill="url(#solana)">
      <path d="M-32-20H28L39-31H-21Z"/>
      <path d="M-25-4H35L24 7H-36Z"/>
      <path d="M-32 20H28L39 9H-21Z"/>
    </g>
  </g>
</svg>